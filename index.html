<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportal - Sistema de Reservas</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --danger-color: #ef4444;
            --success-color: #22c55e;
            --warning-color: #f59e0b;
            --border-color: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1, h2 { text-align: center; color: var(--accent-color); }
        .logo-container { text-align: center; margin-bottom: 15px; }
        .logo-container img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent-color); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn-group { display: flex; gap: 15px; justify-content: center; margin: 20px 0; }
        .btn {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover { background-color: var(--accent-hover); }
        .btn-secondary { background-color: #475569; color: #fff; }
        .btn-secondary:hover { background-color: #64748b; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input, select {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            box-sizing: border-box;
        }
        .hidden { display: none !important; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { border: 1px solid var(--border-color); padding: 8px; text-align: left; }
        th { background-color: #0f172a; }
        .qr-section { text-align: center; margin-top: 15px; background: #111827; padding: 15px; border-radius: 8px; }
        .qr-section img { max-width: 180px; height: auto; border-radius: 6px; border: 2px solid white; }
        
        .horarios-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
            gap: 10px;
            margin-top: 10px;
            max-height: 220px;
            overflow-y: auto;
            padding: 5px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #0f172a;
        }
        .slot-hora {
            padding: 10px;
            text-align: center;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .slot-libre { background-color: var(--success-color); color: #fff; }
        .slot-libre:hover { opacity: 0.8; }
        .slot-pendiente { background-color: var(--warning-color); color: #0f172a; cursor: not-allowed; }
        .slot-ocupado { background-color: var(--danger-color); color: #fff; cursor: not-allowed; }
        .slot-bloqueado { background-color: #64748b; color: #cbd5e1; cursor: not-allowed; }
        .slot-seleccionado { border: 2px solid #fff; transform: scale(1.03); }
        
        .leyenda {
            display: flex;
            gap: 12px;
            font-size: 12px;
            margin-top: 8px;
            justify-content: center;
            color: #94a3b8;
            flex-wrap: wrap;
        }
