<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportal - Sistema de Reservas y Pagos</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #22c55e;
            --danger: #ef4444;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 30px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        h1 { color: #38bdf8; text-align: center; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; color: var(--text-muted); font-weight: bold; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; background: var(--accent); color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; margin-top: 20px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #16a34a; }
        .hidden { display: none; }
        .qr-box { text-align: center; margin-top: 20px; }
        .qr-box img { width: 200px; height: 200px; border-radius: 8px; border: 3px solid #38bdf8; margin-top: 10px; }
        .admin-section { margin-top: 40px; border-top: 2px solid #334155; padding-top: 20px; }
        .reserva-item { background: #0f172a; padding: 15px; border-radius: 8px; margin-top: 10px; border-left: 4px solid #38bdf8; }
        .btn-delete { background: var(--danger); width: auto; padding: 6px 12px; margin-top: 10px; font-size: 0.9rem; }
        .btn-delete:hover { background: #dc2626; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sportal ⚽</h1>

        <div id="pasoDatos">
            <form id="formReserva">
                <label>Tu Nombre:</label>
                <input type="text" id="nombre" required placeholder="Ej. Carlos Pérez">

                <label>Elige la Cancha:</label>
                <select id="cancha">
                    <option value="Cancha Sintética 1">Cancha Sintética 1</option>
                    <option value="Cancha de Losa 2">Cancha de Losa 2</option>
                </select>

                <label>Fecha y Hora:</label>
                <input type="datetime-local" id="fecha" required>

                <button type="submit">Continuar al Pago</button>
            </form>
        </div>

        <div id="pasoPago" class="hidden">
            <h3 style="color: #22c55e; text-align: center;">¡Paso final de Pago!</h3>
            <p style="text-align: center; color: #94a3b8; font-size: 0.9rem; margin-top: 5px;">Escanea el QR para pagar y adjunta tu voucher.</p>
            
            <div class="qr-box">
                <img src="logo_final_sportal.png" alt="Código QR de Pago">
            </div>

            <label>Adjuntar Voucher (Captura de Yape/Plin):</label>
            <input type="file" id="voucher" accept="image/*" required>

            <button type="button" id="btnEnviarReserva">Enviar Reserva y Voucher</button>
        </div>

        <div id="pasoExito" class="hidden" style="text-align: center;">
            <h2 style="color: #22c55e;">¡Reserva enviada con éxito!</h2>
            <p style="color: #94a3b8; margin-top: 10px;">El administrador verificará tu voucher y aprobará tu horario pronto.</p>
            <button onclick="location.reload()" style="background: #38bdf8;">Hacer otra reserva</button>
        </div>

        <div class="admin-section">
            <h3>Panel de Administrador</h3>
            <p style="font-size: 0.85rem; color: #94a3b8;">Reservas pendientes de aprobación:</p>
            <div id="listaAdmin">
                <p style="color: #64748b; font-style: italic;">No hay reservas pendientes en este momento.</p>
            </div>
        </div>
    </div>

    <script>
        const formReserva = document.getElementById('formReserva');
        const pasoDatos = document.getElementById('pasoDatos');
        const pasoPago = document.getElementById('pasoPago');
        const pasoExito = document.getElementById('pasoExito');
        const btnEnviarReserva = document.getElementById('btnEnviarReserva');
        const listaAdmin = document.getElementById('listaAdmin');

        let datosTemporales = {};

        // Al enviar datos del formulario, pasamos al QR
        formReserva.addEventListener('submit', function(e) {
            e.preventDefault();
            datosTemporales.nombre = document.getElementById('nombre').value;
            datosTemporales.cancha = document.getElementById('cancha').value;
            datosTemporales.fecha = document.getElementById('fecha').value;

            pasoDatos.classList.add('hidden');
            pasoPago.classList.remove('hidden');
        });

        // Al enviar el voucher final
        btnEnviarReserva.addEventListener('click', function() {
            const voucherInput = document.getElementById('voucher');
            if(voucherInput.files.length === 0) {
                alert('Por favor adjunta la foto de tu voucher de pago.');
                return;
            }

            datosTemporales.id = Date.now();
            
            // Guardamos en la memoria local del navegador para simular el panel de admin
            let reservas = JSON.parse(localStorage.getItem('sportal_reservas') || '[]');
            reservas.push(datosTemporales);
            localStorage.setItem('sportal_reservas', JSON.stringify(reservas));

            pasoPago.classList.add('hidden');
            pasoExito.classList.remove('hidden');
            cargarAdmin();
        });

        // Función para mostrar las reservas en el panel de administrador
        function cargarAdmin() {
            let reservas = JSON.parse(localStorage.getItem('sportal_reservas') || '[]');
            if(reservas.length === 0) {
                listaAdmin.innerHTML = '<p style="color: #64748b; font-style: italic;">No hay reservas pendientes.</p>';
                return;
            }

            listaAdmin.innerHTML = '';
            reservas.forEach((res, index) => {
                listaAdmin.innerHTML += `
                    <div class="reserva-item">
                        <p><strong>Cliente:</strong> ${res.nombre}</p>
                        <p><strong>Cancha:</strong> ${res.cancha}</p>
                        <p><strong>Fecha:</strong> ${res.fecha}</p>
                        <button class="btn-delete" onclick="eliminarReserva(${index})">Aceptar / Eliminar</button>
                    </div>
                `;
            });
        }

        function eliminarReserva(index) {
            let reservas = JSON.parse(localStorage.getItem('sportal_reservas') || '[]');
            reservas.splice(index, 1);
            localStorage.setItem('sportal_reservas', JSON.stringify(reservas));
            cargarAdmin();
        }

        // Cargar admin al abrir la página
        cargarAdmin();
    </script>
</body>
</html>
